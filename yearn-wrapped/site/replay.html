<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>yearn wrapped · replay</title>
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="assets/yearn-symbol-white-rgb.png" />
  <link rel="stylesheet" href="site.css" />
  <link rel="stylesheet" href="replay.css" />
  <script>
    // Arm the first painted frame before modules or loader graphics arrive.
    (() => {
      const root = document.documentElement;
      let carried = false;
      try {
        carried = sessionStorage.getItem("wrapped-launch") === "1";
        sessionStorage.removeItem("wrapped-launch");
      } catch (err) {}
      if (!carried) return;
      root.classList.add("recap-arrival");
      let opening = false;
      let resolveFinished;
      const finished = new Promise(resolve => { resolveFinished = resolve; });
      const reveal = () => {
        if (opening) return;
        opening = true;
        clearTimeout(fallback);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const cover = document.getElementById("launch-flash");
          const done = event => {
            if (event && (event.target !== cover || event.propertyName !== "opacity")) return;
            clearTimeout(timer);
            cover.removeEventListener("transitionend", done);
            resolveFinished();
          };
          const timer = setTimeout(done, 500);
          cover.addEventListener("transitionend", done);
          root.classList.add("recap-reveal");
        }));
      };
      const fallback = setTimeout(reveal, 900);
      window.wrappedHandoff = {
        closed: () => !root.classList.contains("recap-reveal"),
        reveal,
        finished,
      };
    })();
  </script>
</head>
<body class="replay-loading">
  <canvas id="aurora" aria-hidden="true"></canvas>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./">
      <img src="assets/yearn-wrapped-lockup.svg" alt="yearn wrapped" class="brand-lockup" />
    </a>
    <span class="replay-year" id="replay-year">2026</span>
  </header>

  <main class="deck" id="deck" tabindex="0" aria-label="your year in yVaults"></main>

  <p class="sr-only" id="deck-status" role="status" aria-live="polite"></p>

  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-visual" aria-hidden="true">
      <canvas class="boot-stage" id="boot-stage" aria-hidden="true"></canvas>
      <img class="boot-fallback" src="assets/yearn-symbol-white-rgb.png" alt="">
    </div>
    <p class="boot-line" id="boot-line">warming up the vaults</p>
    <p class="boot-addr" id="boot-addr"></p>
    <p class="boot-hint" id="boot-hint"></p>
  </div>
  <div class="launch-flash" id="launch-flash" aria-hidden="true"></div>

  <footer class="replay-footer">
  <div class="recap-actions" id="recap-actions" role="group" aria-label="Slide actions" hidden>
    <button class="recap-action" type="button" data-action="copy" aria-label="Copy this card as a share image" title="Copy image" disabled>
      <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <svg class="action-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      <span class="btn-label sr-only" aria-live="polite" aria-atomic="true">Copy image</span>
    </button>
    <button class="recap-action" type="button" data-action="download" aria-label="Download this card as a share image" title="Save image" disabled>
      <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <svg class="action-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      <span class="btn-label sr-only" aria-live="polite" aria-atomic="true">Save image</span>
    </button>
    <button class="recap-action" type="button" data-action="post" aria-label="Post this card on X" title="Post on X" disabled>
      <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h4.5L20 20h-4.5L4 4ZM20 4l-6.5 7M4 20l6.5-7"/></svg>
      <svg class="action-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      <span class="btn-label sr-only" aria-live="polite" aria-atomic="true">Post on X</span>
    </button>
  </div>

  <div class="deck-controls" aria-hidden="true" id="dots"></div>

  <div class="data-source" id="data-source">sample data</div>
  </footer>

  <script type="module" src="replay.js"></script>
</body>
</html>
